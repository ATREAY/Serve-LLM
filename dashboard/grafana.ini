[server]
http_port = 3001

[paths]
# __GRAFANA_DATA_DIR__ / __PROVISIONING_DIR__ substituted by
# scripts/observability_start.sh at launch time.
data = __GRAFANA_DATA_DIR__
provisioning = __PROVISIONING_DIR__

[security]
# Local-dev default (Grafana's own out-of-the-box default too). This
# instance is only ever reached via SSH port-forwarding from the login
# node (see scripts/observability_start.sh's printed instructions) — never
# exposed directly — so this is fine as shipped; change it if that changes.
admin_user = admin
admin_password = admin

[analytics]
reporting_enabled = false
check_for_updates = false
